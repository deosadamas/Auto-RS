; RS3 (NXT client) profile. Pick this file in the Config dropdown.
; All coordinates are CLIENT coords of the game window (press F3 while hovering the game).
; RS3 has no fixed layout: run the client WINDOWED (not fullscreen), lock the interface
; (Esc > Interface > Edit layout > Lock), keep UI scale fixed, then sample EVERY coordinate below with F3.

[General]
WindowTitle=ahk_exe rs2client.exe
LogFile=bot.log

[AntiBan]
; minutes between breaks / minutes per break / % chance per step of a small idle action
BreakEveryMin=35
BreakEveryMax=70
BreakLenMin=3
BreakLenMax=10
IdleChance=4

[Inventory]
; Backpack: center of slot 1 (top-left) and spacing between slot centers. Sample slot 1
; and slot 2 with F3 for DX, slot 1 and slot 5 for DY.
FirstSlot=0,0
SlotDX=36
SlotDY=32
; RS3 has no shift-drop: the bot right-clicks each item and clicks "Drop" in the menu.
DropMode=menu
; Right-click a log in slot 1, hover the "Drop" entry, press F3, paste here. The offset
; from slot 1 is reused for every slot, so position the backpack so the menu is not
; pushed back inside the window edge for the bottom row (leave ~150 px below it).
DropMenuEntry=0,0

[Woodcutter]
; No object markers in RS3: F3 over a bright, distinctive part of the tree (trunk works
; better than leaves) and raise the tolerance if the bot misses trees.
TreeColor=0x000000
TreeTolerance=20
; x1,y1,x2,y2 of the 3D viewport, excluding interface panels
SearchRegion=0,0,800,500
; F3 over the center of a log in your backpack
LogColor=0x000000
LogTolerance=12
; ms to wait after clicking a tree before checking progress
ChopWaitMin=5000
ChopWaitMax=9000

[AutoClicker]
Target=0,0
IntervalMin=1800
IntervalMax=3200
Jitter=3
